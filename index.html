<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176b5d" />
    <meta
      name="description"
      content="Controle local de álbum de figurinhas com registro rápido por ditado."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>FIFA World Cup 26</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Album individual</p>
          <h1 id="albumName">FIFA World Cup 26</h1>
        </div>
        <button class="icon-button" id="installButton" type="button" hidden aria-label="Instalar app">
          Instalar
        </button>
      </header>

      <main>
        <section class="hero-panel" aria-labelledby="quickRegisterTitle">
          <div class="progress-summary" id="progressSummary" aria-live="polite"></div>

          <form class="entry-form" id="entryForm">
            <label for="commandInput" id="quickRegisterTitle">Fale ou digite as figurinhas</label>
            <textarea
              id="commandInput"
              name="commands"
              rows="4"
              autocomplete="off"
              autocapitalize="sentences"
              placeholder="Brasil 12, Argentina 8, Franca 20"
            ></textarea>
            <button class="primary-action" type="submit">Registrar</button>
          </form>

          <div class="result-panel" id="resultPanel" aria-live="polite"></div>

          <div class="action-row">
            <button id="undoButton" type="button" disabled>Desfazer</button>
            <button id="backupTabButton" type="button" data-view-target="backup">Backup</button>
          </div>

          <nav class="quick-tabs" aria-label="Atalhos da colecao">
            <button type="button" data-filter-shortcut="owned">Possuidas</button>
            <button type="button" data-filter-shortcut="missing">Faltantes</button>
            <button type="button" data-filter-shortcut="duplicates">Repetidas</button>
          </nav>
        </section>

        <section class="section-band" aria-labelledby="collectionTitle">
          <div class="section-heading">
            <h2 id="collectionTitle">Colecao</h2>
            <div class="view-tabs" role="tablist" aria-label="Telas">
              <button type="button" data-view="collection" aria-selected="true">Lista</button>
              <button type="button" data-view="backup" aria-selected="false">Backup</button>
            </div>
          </div>

          <div id="collectionView">
            <div class="tool-strip">
              <label class="search-field">
                <span>Pesquisar</span>
                <input
                  id="searchInput"
                  type="search"
                  placeholder="Secao, numero ou id"
                  autocomplete="off"
                />
              </label>
              <div class="segmented-control" role="group" aria-label="Filtros">
                <button type="button" data-filter="all" aria-pressed="true">Todas</button>
                <button type="button" data-filter="owned" aria-pressed="false">Possuidas</button>
                <button type="button" data-filter="missing" aria-pressed="false">Faltantes</button>
                <button type="button" data-filter="duplicates" aria-pressed="false">Repetidas</button>
              </div>
            </div>

            <div class="section-progress" id="sectionProgress"></div>
            <div class="sticker-list" id="stickerList"></div>
          </div>

          <div id="backupView" hidden>
            <div class="backup-actions">
              <button type="button" id="exportButton">Exportar backup</button>
              <label class="file-action">
                Importar backup
                <input type="file" id="importInput" accept="application/json,.json" />
              </label>
              <button type="button" id="clearButton" class="danger-action">Apagar todos os dados</button>
            </div>
            <div class="backup-status" id="backupStatus" aria-live="polite"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
