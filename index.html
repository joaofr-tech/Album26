<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#166534" />
    <meta name="description" content="Controle simples de figurinhas da FIFA World Cup 26 por ditado." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>FIFA World Cup 26</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar"><p>Album de figurinhas</p><h1 id="albumName">FIFA World Cup 26</h1></header>
      <main>
        <section id="homeView">
          <section class="register-panel" aria-labelledby="registerTitle">
            <div class="progress-summary" id="progressSummary" aria-live="polite"></div>
            <form id="entryForm">
              <label id="registerTitle" for="commandInput">Fale ou digite as figurinhas</label>
              <textarea id="commandInput" name="commands" rows="3" autocomplete="off" autocapitalize="sentences" placeholder="Brasil 12, Argentina 8, Fran&ccedil;a 20"></textarea>
              <button class="primary-action" type="submit">Registrar</button>
              <button class="secondary-action" id="exportMissingButton" type="button">Exportar faltantes</button>
            </form>
            <div class="result-panel" id="resultPanel" aria-live="polite"></div>
          </section>
          <section class="cards-section" aria-labelledby="teamsTitle"><h2 id="teamsTitle">Sele&ccedil;&otilde;es</h2><div class="section-cards" id="selectionCards"></div></section>
          <section class="cards-section" id="extrasSection" aria-labelledby="extrasTitle" hidden><h2 id="extrasTitle">Outras figurinhas</h2><div class="section-cards" id="extraCards"></div></section>
        </section>
        <section id="detailView" hidden aria-labelledby="detailTitle">
          <button class="back-button" id="detailBackButton" type="button">&larr; Sele&ccedil;&otilde;es</button>
          <div class="detail-heading"><div><p id="detailProgress"></p><h2 id="detailTitle"></h2></div><span class="legend"><i class="owned-dot"></i> Possu&iacute;da <i class="missing-dot"></i> Faltante</span></div>
          <div class="sticker-grid" id="stickerGrid"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
